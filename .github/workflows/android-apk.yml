name: Android APK

# Собирает устанавливаемый debug-APK приложения водителя и выкладывает его
# артефактом. Запуск вручную (кнопка Run workflow) или на push в master —
# на каждый PR не гоняется, чтобы не замедлять основной CI.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'apps/driver-android/**'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build dev debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/driver-android
    steps:
      - uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble dev debug APK
        run: ./gradlew :app:assembleDevDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: resilient-taxi-driver-dev-debug
          path: apps/driver-android/app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error
          retention-days: 14
