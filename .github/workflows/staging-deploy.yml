name: Staging Deploy

# Deploys to the staging environment ONLY — this workflow must never be
# pointed at production infrastructure (see docker-compose.prod.yml /
# docker-compose.managed.yml, which are entirely separate and untouched
# by anything here).
#
# Triggers: manual (workflow_dispatch) and, optionally, on every push to
# master — remove the `push` trigger below if staging should only ever
# be deployed on demand.
#
# Requires a GitHub Environment named "staging" with these secrets:
#   STAGING_SSH_HOST           - staging host's address
#   STAGING_SSH_USER           - SSH user on that host
#   STAGING_SSH_PRIVATE_KEY    - private key for that user
#   STAGING_DEPLOY_PATH        - path to the repo checkout on that host
# The host is expected to already have its own .env.staging in place
# (see .env.staging.example) — this workflow never writes secrets to it,
# only builds/pushes images and tells the host to pull + restart.
#
# NOTE: this workflow has not been exercised against a real runner/host in
# the environment this was authored in (no live staging VM or configured
# GitHub Environment to test against) — review it against your actual
# staging host setup before relying on it. See docs/staging/deployment.md.

on:
  workflow_dispatch: {}
  push:
    branches: [master]

concurrency:
  group: staging-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push images (commit-SHA tag)
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Tagged with both the immutable commit SHA (what the deploy step
      # actually pulls) and a floating `staging-latest` (for convenience
      # inspection only — never what a deploy relies on).
      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-api:${{ github.sha }}
            ghcr.io/${{ github.repository }}-api:staging-latest
          build-args: |
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push admin-web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin-web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-admin-web:${{ github.sha }}
            ghcr.io/${{ github.repository }}-admin-web:staging-latest
          build-args: |
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=admin-web
          cache-to: type=gha,mode=max,scope=admin-web

  migrate-and-deploy:
    name: Migrate + deploy to the staging host
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    env:
      API_IMAGE: ghcr.io/${{ github.repository }}-api:${{ needs.build-and-push.outputs.image_tag }}
      ADMIN_IMAGE: ghcr.io/${{ github.repository }}-admin-web:${{ needs.build-and-push.outputs.image_tag }}
    steps:
      - name: Pull images, run migrations, restart services
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          envs: API_IMAGE,ADMIN_IMAGE
          script: |
            set -euo pipefail
            cd "${{ secrets.STAGING_DEPLOY_PATH }}"
            git fetch --depth 1 origin "${{ github.sha }}"
            git checkout "${{ github.sha }}"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            export STAGING_API_IMAGE="$API_IMAGE"
            export STAGING_ADMIN_IMAGE="$ADMIN_IMAGE"
            docker compose -f docker-compose.staging.yml --env-file .env.staging pull api admin-web
            docker compose -f docker-compose.staging.yml --env-file .env.staging up -d --wait

      - name: Run the smoke test on the staging host
        id: smoke
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.STAGING_DEPLOY_PATH }}"
            bash scripts/staging/smoke.sh 2>&1 | tee /tmp/staging-smoke-report.log
            test "${PIPESTATUS[0]}" -eq 0

      - name: Fetch the smoke test report
        if: always()
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          source: /tmp/staging-smoke-report.log
          target: .
          strip_components: 1

      - name: Upload smoke test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-smoke-report
          path: tmp/staging-smoke-report.log
          if-no-files-found: ignore

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Staging deploy"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- API image: \`$API_IMAGE\`"
            echo "- Admin-web image: \`$ADMIN_IMAGE\`"
            echo "- Smoke test: ${{ steps.smoke.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
