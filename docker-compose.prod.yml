name: resilient-taxi-prod

# Production topology for a single Compute VM (Yandex Cloud or any Docker host):
# PostGIS + Redis + one-shot migrations + the API behind Caddy (automatic HTTPS).
#
# For a managed-services deployment (Yandex Managed PostgreSQL + Redis), remove
# the `postgres` and `redis` services and point DATABASE_URL / REDIS_URL at the
# managed endpoints in the .env file.
#
# Usage:
#   cp .env.prod.example .env   # then fill in secrets and DOMAIN
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4.9-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--requirepass',
        '${REDIS_PASSWORD:?REDIS_PASSWORD is required}',
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # One-shot: applies Prisma migrations, then exits. Built from the Dockerfile's
  # build stage, which carries the schema, migrations and Prisma CLI.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    env_file: .env
    command: ['pnpm', '--filter', '@resilient-taxi/api', 'db:migrate:deploy']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    expose:
      - '3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  postgres_data:
    name: resilient-taxi-prod-postgres-data
  redis_data:
    name: resilient-taxi-prod-redis-data
  caddy_data:
    name: resilient-taxi-prod-caddy-data
  caddy_config:
    name: resilient-taxi-prod-caddy-config
